<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#312E73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AWARENESS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>AWARENESS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#F2F3F6;--surface:#FFFFFF;--surface-2:#EBEDF2;--ink:#161A24;--ink-2:#4A5163;--ink-3:#7A8194;--line:#DCDFE7;
  --accent:#2F4BD8;--accent-ink:#FFFFFF;--accent-soft:#E3E7FB;
  --ok:#1E8A5A;--ok-soft:#DDF2E7;--warn:#A86A10;--warn-soft:#FBEBD0;--bad:#C0362C;--bad-soft:#FADFDC;
  --shadow:0 1px 2px rgba(22,26,36,.06),0 8px 24px rgba(22,26,36,.08);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0E1117;--surface:#161A23;--surface-2:#1E2330;--ink:#E8EBF2;--ink-2:#AEB4C3;--ink-3:#7D8497;--line:#2A303D;
  --accent:#8198FF;--accent-ink:#0E1117;--accent-soft:#232B4C;
  --ok:#4CC38A;--ok-soft:#173327;--warn:#E3AA4E;--warn-soft:#3A2C14;--bad:#F07167;--bad-soft:#3D1D1B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0E1117;--surface:#161A23;--surface-2:#1E2330;--ink:#E8EBF2;--ink-2:#AEB4C3;--ink-3:#7D8497;--line:#2A303D;
  --accent:#8198FF;--accent-ink:#0E1117;--accent-soft:#232B4C;
  --ok:#4CC38A;--ok-soft:#173327;--warn:#E3AA4E;--warn-soft:#3A2C14;--bad:#F07167;--bad-soft:#3D1D1B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:-.01em;padding:0 8px;display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:9px;flex:none;display:block}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;padding:9px 10px;border-radius:8px;color:var(--ink-2);text-align:left;font-weight:500;white-space:nowrap}
nav button:hover{background:var(--surface-2);color:var(--ink)}
nav button.on{background:var(--accent-soft);color:var(--accent)}
nav button .cnt{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.side-foot button{border:1px solid var(--line);background:none;border-radius:8px;padding:8px 10px;text-align:left;color:var(--ink-2);font-size:13px}
.side-foot button:hover{background:var(--surface-2)}
.side-foot button.armed{border-color:var(--bad);color:var(--bad)}

main{padding-block:24px 60px;padding-inline:28px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.head h1{font-family:var(--f-display);font-weight:600;font-size:24px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--ink-3)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0;width:220px;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.banner{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 14px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:13.5px}
.empty{color:var(--ink-3);padding:28px 8px;text-align:center}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.kpi b{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi span{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.kpi em{font-style:normal;font-size:12.5px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dday{font-family:var(--f-mono);font-size:11.5px;font-weight:500;border-radius:6px;padding:3px 7px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;min-width:52px;text-align:center}
.dday.soon{background:var(--warn-soft);color:var(--warn)}
.dday.now{background:var(--accent);color:var(--accent-ink)}
.dday.late{background:var(--bad-soft);color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;border-radius:5px}
.bar .v{text-align:right;color:var(--ink-2)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.plan{background:var(--accent-soft);color:var(--accent)}
.pill.work{background:var(--warn-soft);color:var(--warn)}
.pill.done,.pill.paid{background:var(--ok-soft);color:var(--ok)}
.pill.closed{background:var(--surface-2);color:var(--ink-3)}
.pill.cancel{background:var(--bad-soft);color:var(--bad)}
.pill.pl{background:var(--warn-soft);color:var(--warn)}
button.pill{border:0}

.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:720px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
td .sub{display:block;font-size:12px;color:var(--ink-3)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.prog{display:flex;align-items:center;gap:8px;min-width:110px}
.prog .track{flex:1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.prog .fill{height:100%;background:var(--accent)}
.prog small{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.stars{color:var(--warn);letter-spacing:1px;white-space:nowrap}

/* Kanban */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 250px;background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px;border:2px solid transparent}
.col.over{border-color:var(--accent)}
.col-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 4px 6px;border-bottom:2px solid var(--hue)}
.col-h b{font-weight:600;font-size:13px}
.col-h span{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);text-align:right}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;cursor:grab;text-align:left;width:100%}
.card:hover{border-color:var(--ink-3)}
.card.dragging{opacity:.45}
.card .t{font-weight:600;font-size:13.5px}
.card .m{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.card .who{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:10.5px;font-weight:600}

/* Drawer */
.drawer-scrim{position:fixed;inset:0;background:rgba(10,12,18,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:21;overflow-y:auto;box-shadow:var(--shadow);padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 40px);padding-inline:22px;display:flex;flex-direction:column;gap:14px}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dhead h2{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--ink-2);font-size:13px}
.meta b{color:var(--ink-3);font-weight:500}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.econ{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.econ div{display:flex;flex-direction:column;gap:2px}
.econ small{font-size:11.5px;color:var(--ink-3)}
.econ b{font-family:var(--f-mono);font-weight:500;font-size:14px}
.econ i{font-style:normal;font-size:11.5px;color:var(--ink-3)}
.ck{display:flex;align-items:center;gap:10px;padding:5px 0}
.ck input{width:16px;height:16px;accent-color:var(--accent);flex:none}
.ck span{flex:1}
.ck.done span{color:var(--ink-3);text-decoration:line-through}
.x{border:0;background:none;color:var(--ink-3);font-size:16px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{background:var(--surface-2);color:var(--bad)}
.row-form{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.row-form input,.row-form select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;min-width:0;flex:1 1 120px}
.mini.pay{grid-template-columns:minmax(0,1fr) auto auto auto;cursor:pointer;border-radius:6px}
.mini.pay:hover{background:var(--surface-2)}
.mini.pay .x.armed{background:var(--bad);color:#fff;font-size:12px;padding:3px 8px}
.mini{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.mini:first-of-type{border-top:0}
.mini .t{font-weight:500}
.mini .s{font-size:12px;color:var(--ink-3)}
.note{white-space:pre-wrap;color:var(--ink-2)}

/* Modal */
.modal-wrap{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:rgba(10,12,18,.45)}
.sheet{position:relative;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(620px,100%);max-height:calc(100% - 20px);overflow-y:auto;padding:20px}
.sheet h3{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0 0 16px;letter-spacing:-.01em}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld span{font-size:12px;color:var(--ink-3);font-weight:500}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.fld textarea{resize:vertical}
.sheet-foot{display:flex;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap}
.sheet-foot div{display:flex;gap:8px}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13.5px;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);z-index:10;overflow-x:auto}
  .brand small{display:none}
  nav{flex-direction:row}
  nav button .cnt{display:none}
  .side-foot{margin:0;flex-direction:row}
  .side-foot button{white-space:nowrap}
  main{padding-inline:16px;padding-block:18px 60px}
  .fields{grid-template-columns:1fr}
  .bar{grid-template-columns:90px minmax(0,1fr) 90px}
  .drawer{padding-inline:16px}
}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(24px)}to{transform:none}}
}
/* auth */
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px}
.auth-card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.auth-card .brand{padding:0;font-size:22px}
.auth-card p{margin:0;color:var(--ink-2)}
.auth-card .err{color:var(--bad);font-size:13px}
.auth-card .link{border:0;background:none;color:var(--accent);padding:0;text-align:left;font-size:13px}
.me{font-size:12.5px;color:var(--ink-3);padding:0 4px}
.me b{display:block;color:var(--ink);font-weight:600;font-size:13px}
.users{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.urow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 130px;gap:8px;align-items:center}
.urow input,.urow select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
.urow small{color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{font-size:12.5px;color:var(--ink-3);background:var(--surface-2);border-radius:8px;padding:10px 12px;margin-bottom:14px}
@media (max-width:560px){.urow{grid-template-columns:1fr 1fr}.urow small{grid-column:1/-1}}
</style>

<body>

<div class="app">
  <aside class="side">
    <div class="brand"><img class="logo" src="icon.svg" alt=""><div>AWARENESS<small>CRM ивент-агентства</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <main id="main"></main>
</div>
<div id="drawer" hidden></div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<div id="auth" hidden></div>

<script src="config.js"></script>
<script src="supabase-lite.js"></script>
<script>
const STAGES=[['lead','Новый лид'],['brief','Бриф'],['kp','КП отправлено'],['talks','Переговоры'],['contract','Договор'],['won','Выиграно'],['lost','Проиграно']];
const STAGE_HUE={lead:'#8A93A8',brief:'#3E8FD6',kp:'#6C5FD3',talks:'#C9851A',contract:'#1F9D8B',won:'#2E9B57',lost:'#C8372D'};
const EV_STATUS=[['plan','Подготовка'],['work','В работе'],['done','Проведено'],['closed','Закрыто'],['cancel','Отменено']];
const EVTYPES=['Корпоратив','Конференция','Презентация / запуск','Тимбилдинг','Свадьба','Частный праздник','Выставка / стенд','Промо / BTL','Фестиваль','Выездное мероприятие'];
const CATS=['Площадка','Декор и застройка','Реквизит и костюмы','Материалы и производство','Мебель','Дизайн','Свет и звук','Экраны и видео','Кейтеринг','Ведущий','Артисты','Хосты и промо-персонал','Фото и видео','Транспорт','Флористика','Печать','Монтажники и техперсонал','Персонал и администраторы','Прочее'];
const CTYPE=['Подрядчик','Фрилансер','Штат'];
const FIN_CATS=['Предоплата','Постоплата','Доп. услуги','Подрядчики','Декор','Кейтеринг','Техника','Мебель','Дизайн','Площадка','Персонал','Логистика','Реквизит и материалы','Менеджмент','Налоги и комиссии','Прочее'];
const DOCS=['ЭДО','Оригинал','Скан','Чек','Нал','ВБ','Нет'];
const CHECKLIST=['Бриф согласован','Смета утверждена','Договор подписан','Предоплата получена','Площадка забронирована','Подрядчики подтверждены','Тайминг согласован с клиентом','План монтажа и техрайдер','Брифинг персонала','Монтаж','Проведение','Демонтаж','Закрывающие документы','Постоплата получена'];
const COLS=['clients','deals','events','contractors','finance','tasks'];

const F={
  clients:{nw:'Новый клиент',ed:'Клиент',fields:[
    ['name','Компания или ФИО','text',{req:1,wide:1}],['kind','Тип','select',{opts:['Компания','Частное лицо','Агентство']}],
    ['source','Источник','select',{opts:['Рекомендация','Сайт','Соцсети','Повторный клиент','Тендер','Холодный контакт'],empty:1}],
    ['contact','Контактное лицо','text'],['phone','Телефон','tel'],['email','Email','email'],['note','Заметки','textarea']]},
  deals:{nw:'Новая сделка',ed:'Сделка',fields:[

const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const daysTo=d=>{if(!d)return null;return Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5)};
const fdate=d=>{if(!d)return '—';const p=d.split('-');return p.length===3?`${p[2]}.${p[1]}.${p[0].slice(2)}`:d};
const optPairs=l=>l.map(x=>Array.isArray(x)?x:[x,x]);
const lbl=(l,v)=>{const f=optPairs(l).find(x=>x[0]===v);return f?f[1]:(v||'—')};

function dday(d){const n=daysTo(d);if(n==null)return '<span class="dday">без даты</span>';
  if(n===0)return '<span class="dday now">Сегодня</span>';
  if(n<0)return `<span class="dday">${fdate(d)}</span>`;
  return `<span class="dday ${n<=7?'soon':''}">Д–${n}</span>`}
function econ(evId){const r={inPaid:0,inPlan:0,outPaid:0,outPlan:0};
  S.finance.filter(o=>o.eventId===evId).forEach(o=>{const a=+o.amount||0;
    if(o.kind==='in'){if(o.status==='paid')r.inPaid+=a;else r.inPlan+=a}else{if(o.status==='paid')r.outPaid+=a;else r.outPlan+=a}});
  r.inAll=r.inPaid+r.inPlan;r.outAll=r.outPaid+r.outPlan;r.margin=r.inAll-r.outAll;r.pct=r.inAll?Math.round(r.margin/r.inAll*100):null;return r}
function totals(){const r={inPaid:0,inPlan:0,outPaid:0,outPlan:0};S.finance.forEach(o=>{const a=+o.amount||0;
  if(o.kind==='in'){if(o.status==='paid')r.inPaid+=a;else r.inPlan+=a}else{if(o.status==='paid')r.outPaid+=a;else r.outPlan+=a}});return r}

function fail(e){const m=String(e&&(e.message||e.error_description)||'');

  else if(/JWT|session/i.test(m)){toast('Сессия истекла. Войдите снова.');signOut()}
  else if(/Failed to fetch|NetworkError/i.test(m))toast('Нет соединения с сервером. Проверьте интернет.');
  else toast('Не удалось сохранить: '+(m||'ошибка'));console.error(e)}
const newId=()=>(crypto.randomUUID?crypto.randomUUID():uid()+uid()+uid()).replace(/-/g,'');
const rowToDoc=r=>({...(r.data||{}),id:r.id,createdAt:r.created_at});
function upsertLocal(col,doc){const i=S[col].findIndex(x=>x.id===doc.id);if(i>=0)S[col][i]=doc;else S[col].push(doc);schedule()}
async function create(col,data){if(!S.db){toast('Нет соединения с базой');return null}
  const id=newId();const {data:rows,error}=await S.db.from(col).insert({id,data}).select('id,data,created_at');
  if(error){fail(error);return null}if(rows&&rows[0])upsertLocal(col,rowToDoc(rows[0]));return id}
async function patch(col,id,data){if(!S.db)return false;
  const {error}=await S.db.rpc('patch_doc',{tbl:col,doc_id:id,patch:data});
  if(error){fail(error);return false}const cur=byId(col,id);if(cur)upsertLocal(col,{...cur,...data});return true}
async function remove(col,id){if(!S.db)return;const {error}=await S.db.from(col).delete().eq('id',id);
  if(error)return fail(error);S[col]=S[col].filter(x=>x.id!==id);schedule()}

function field([k,lab,type,o={}],v){const idf='f-'+k;let inp;
  if(type==='textarea')inp=`<textarea id="${idf}" name="${k}" rows="4">${esc(v)}</textarea>`;
  else if(['select','client','event','member'].includes(type)){
    let opts=type==='select'?optPairs(o.opts):type==='client'?S.clients.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),'ru')).map(c=>[c.id,c.name])
      :type==='event'?S.events.slice().sort(byDate()).map(e=>[e.id,e.title+(e.date?' · '+fdate(e.date):'')]):S.team.map(m=>[m,m]);
    if(type==='member'&&v&&!S.team.includes(v))opts.push([v,v]);
    const empty=(type!=='select'||o.empty)?'<option value="">—</option>':'';
    const addNew=type==='client'?'<option value="__new">+ Новый клиент…</option>':'';
    inp=`<select id="${idf}" name="${k}" ${type==='client'?'data-act-change="newClient"':''}>${empty}${addNew}${opts.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(v??'')?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
  }else inp=`<input id="${idf}" name="${k}" type="${type}" value="${esc(v)}" ${o.list?`list="${o.list}" autocomplete="off"`:''} ${o.req?'required':''} ${type==='number'?'inputmode="decimal" step="any" min="0"':''}>`;
  return `<label class="fld ${o.wide||type==='textarea'?'wide':''}"><span>${lab}</span>${inp}</label>`}

  async ckAdd(f){const e=byId('events',S.drawer?.id);const text=f.text.value.trim();if(!e||!text)return;
    f.text.value='';await patch('events',e.id,{checklist:[...(e.checklist||[]),{id:uid(),text,done:false}]})},
  async crewAdd(f){const e=byId('events',S.drawer?.id);if(!e)return;const cid=f.contractorId.value;if(!cid)return;
    const k=byId('contractors',cid);const cost=S.isAdmin?(Number(f.cost?.value)||0):0;const role=f.role.value.trim();let finId=null;
    f.contractorId.value='';f.role.value='';if(f.cost)f.cost.value='';
    if(cost>0&&S.isAdmin)finId=await create('finance',{kind:'out',status:'plan',eventId:e.id,category:'Подрядчики',amount:cost,date:e.date||today(),counterparty:k?.name||'',note:role});
    const cur=byId('events',e.id);
    if(await patch('events',e.id,{crew:[...(cur.crew||[]),{id:uid(),contractorId:cid,role,cost,finId}]}))toast('Назначено')},
  async team(f){const btn=f.querySelector('.btn.pri');btn.disabled=true;let ok=true;
    for(const u of S.profiles){const n=f.elements['name-'+u.id],r=f.elements['role-'+u.id];const upd={};
      if(n&&!n.disabled&&n.value.trim()!==u.name)upd.name=n.value.trim();
      if(r&&!r.disabled&&r.value!==u.role)upd.role=r.value;
      if(Object.keys(upd).length){const {error}=await S.db.from('profiles').update(upd).eq('id',u.id);if(error){ok=false;fail(error)}else Object.assign(u,upd)}}
    const members=f.members.value.split('\n').map(s=>s.trim()).filter(Boolean);
    const {error}=await S.db.from('settings').upsert({id:'team',data:{members}});
    if(error){ok=false;fail(error)}else S.extraTeam=members;
    recomputeTeam();btn.disabled=false;if(ok){closeModal();toast('Команда сохранена');render()}}
};

async function mkEvent(dealId){const d=byId('deals',dealId);if(!d)return;
  const evId=await create('events',{title:d.title,clientId:d.clientId||'',dealId:d.id,eventType:d.eventType||'',date:d.eventDate||'',guests:d.guests??null,budget:d.budget??null,
    status:'plan',manager:d.owner||'',venue:d.venue||'',city:d.city||'',note:d.note||'',checklist:CHECKLIST.map(t=>({id:uid(),text:t,done:false})),crew:[]});
  if(!evId)return;
  await patch('deals',d.id,{eventId:evId});
  const b=+d.budget||0;
  if(b>0&&S.isAdmin){await create('finance',{kind:'in',status:'plan',eventId:evId,category:'Предоплата',amount:Math.round(b/2),date:today(),counterparty:cname(d.clientId),note:'50% по договору'});
    await create('finance',{kind:'in',status:'plan',eventId:evId,category:'Постоплата',amount:b-Math.round(b/2),date:d.eventDate||'',counterparty:cname(d.clientId),note:'50% после мероприятия'})}
  toast('Мероприятие создано, платежи запланированы');openDrawer('event',evId);
}
function openDrawer(kind,id){S.drawer={kind,id};renderDrawer();setTimeout(()=>$('#drawer .x')?.focus(),30)}

/* ---------- events ---------- */
function arm(btn,text){if(btn.dataset.armed){return true}btn.dataset.armed='1';const old=btn.textContent;btn.textContent=text;btn.classList.add('armed');
  setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=old;btn.classList.remove('armed')}},4000);return false}
document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;const id=el.dataset.id;
  if(act==='taskDone'||act==='ckToggle'){ev.stopPropagation()}
  else if(el.tagName!=='LABEL'&&!(el.tagName==='INPUT'))ev.preventDefault();
  switch(act){
    case 'nav':S.view=el.dataset.view;S.drawer=null;try{history.replaceState(null,'','#'+S.view)}catch(e){}render();window.scrollTo(0,0);break;
    case 'new':{const col=el.dataset.col;const p={};
      if(col==='deals'){p.stage='lead';if(el.dataset.client)p.clientId=el.dataset.client}
      if(col==='events'){p.status='plan'}
      if(col==='finance'){p.kind=el.dataset.kind||'in';p.status='plan';p.date=today();p.category=p.kind==='in'?'Предоплата':'Подрядчики';if(el.dataset.event)p.eventId=el.dataset.event}
      if(col==='tasks'&&el.dataset.event)p.eventId=el.dataset.event;
      if(col==='contractors'&&S.ctFilter)p.category=S.ctFilter;
      openForm(col,null,p);break}
    case 'edit':openForm(el.dataset.col,id);break;
    case 'drawer':openDrawer(el.dataset.kind,id);break;
    case 'closeDrawer':S.drawer=null;renderDrawer();break;
    case 'closeModal':closeModal();break;
    case 'del':if(arm(el,'Точно удалить?')){await remove(el.dataset.col,id);closeModal();if(S.drawer?.id===id){S.drawer=null;renderDrawer()}toast('Удалено')}break;
    case 'mkEvent':el.disabled=true;await mkEvent(id);break;
    case 'evf':S.evFilter=el.dataset.v;render();break;
    case 'ctf':S.ctFilter=el.dataset.v;render();break;
    case 'finf':S[el.dataset.k]=el.dataset.v;render();break;
    case 'finDel':if(arm(el,'Удалить?')){await remove('finance',id);toast('Платёж удалён')}break;
    case 'finToggle':{const o=byId('finance',id);if(o)await patch('finance',id,{status:o.status==='paid'?'plan':'paid'});break}
    case 'taskDone':{const t=byId('tasks',id);if(t)await patch('tasks',id,{done:!t.done});break}
    case 'ckToggle':{const e=byId('events',S.drawer?.id);if(!e)break;await patch('events',e.id,{checklist:(e.checklist||[]).map(x=>x.id===el.dataset.ck?{...x,done:!x.done}:x)});break}
    case 'ckDel':{const e=byId('events',S.drawer?.id);if(!e)break;await patch('events',e.id,{checklist:(e.checklist||[]).filter(x=>x.id!==el.dataset.ck)});break}
    case 'crewDel':{const e=byId('events',S.drawer?.id);if(!e)break;const x=(e.crew||[]).find(c=>c.id===el.dataset.crew);
      if(await patch('events',e.id,{crew:(e.crew||[]).filter(c=>c.id!==el.dataset.crew)})&&x?.finId&&S.isAdmin){const o=byId('finance',x.finId);if(o&&o.status!=='paid')await remove('finance',x.finId)}break}
    case 'team':{const m=$('#modal');m.hidden=false;
      const users=S.profiles.slice().sort((x,y)=>String(x.name).localeCompare(String(y.name),'ru'));
      m.innerHTML=`<div class="modal-wrap"><div class="scrim" data-act="closeModal"></div><form class="sheet" data-form="team"><h3>Команда</h3>
      <div class="fld wide" style="margin-bottom:8px"><span>Сотрудники с доступом</span></div>
      <div class="users">${users.map(u=>`<div class="urow"><input id="u-name-${u.id}" name="name-${u.id}" value="${esc(u.name)}" ${S.isAdmin||u.id===S.me?.id?'':'disabled'} aria-label="Имя">
        <small>${esc(u.email||'')}</small>
        <select id="u-role-${u.id}" name="role-${u.id}" ${S.isAdmin&&u.id!==S.me?.id?'':'disabled'} aria-label="Роль"><option value="admin" ${u.role==='admin'?'selected':''}>Администратор</option><option value="manager" ${u.role!=='admin'?'selected':''}>Менеджер</option></select></div>`).join('')}</div>
      ${S.isAdmin?'<div class="hint">Чтобы дать доступ новому сотруднику: Supabase → Authentication → Users → Add user → Create new user (email и пароль, галочка Auto Confirm). Он появится здесь как менеджер.</div>':''}
      <label class="fld wide"><span>Люди без входа в CRM (например, подрядчики-партнёры). По одному имени в строке. Они появятся в полях «Ответственный», «Менеджер», «Исполнитель».</span><textarea id="team-members" name="members" rows="4">${esc(S.extraTeam.join('\n'))}</textarea></label>
      <div class="sheet-foot"><span></span><div><button type="button" class="btn ghost" data-act="closeModal">Отмена</button><button class="btn pri">Сохранить</button></div></div></form></div>`;break}
    case 'signOut':signOut();break;
    case 'clearDemo':if(arm(el,'Точно удалить все примеры?')){el.disabled=true;
      const jobs=[];COLS.forEach(c=>S[c].filter(x=>x.demo).forEach(x=>jobs.push([c,x.id])));
      for(let i=0;i<jobs.length;i+=8)await Promise.all(jobs.slice(i,i+8).map(([c,x])=>remove(c,x)));
      S.drawer=null;toast('Примеры удалены. CRM готова к работе.')}break;
  }
});
document.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target;FORMS[f.dataset.form]?.(f)});
document.addEventListener('input',ev=>{const k=ev.target.dataset?.q;if(k!=null){S.q[k]=ev.target.value;render()}});
document.addEventListener('change',async ev=>{const a=ev.target.dataset?.actChange;if(!a)return;
  if(a==='taskWho'){S.taskWho=ev.target.value;render()}
  if(a==='newClient'&&ev.target.value==='__new'){const sel=ev.target;const name=(prompt('Название клиента (компания или ФИО):')||'').trim();
    if(!name){sel.value='';return}
    sel.disabled=true;const id=await create('clients',{name,kind:'Компания',contact:'',phone:'',email:'',source:'',note:''});sel.disabled=false;
    if(!id){sel.value='';return}
    const o=document.createElement('option');o.value=id;o.textContent=name;sel.appendChild(o);sel.value=id;toast('Клиент «'+name+'» добавлен')}
  if(a==='evStatus')await patch('events',ev.target.dataset.id,{status:ev.target.value})});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(!$('#modal').hidden)closeModal();else if(S.drawer){S.drawer=null;renderDrawer()}}
  if(ev.key==='Enter'&&ev.target.classList?.contains('card'))openForm('deals',ev.target.dataset.id)});
/* drag & drop in funnel */
document.addEventListener('dragstart',ev=>{const c=ev.target.closest?.('[data-deal]');if(!c)return;ev.dataTransfer.setData('text/plain',c.dataset.deal);ev.dataTransfer.effectAllowed='move';c.classList.add('dragging')});
document.addEventListener('dragend',ev=>{ev.target.classList?.remove('dragging');document.querySelectorAll('.col.over').forEach(c=>c.classList.remove('over'))});
document.addEventListener('dragover',ev=>{const col=ev.target.closest?.('.col');if(!col)return;ev.preventDefault();document.querySelectorAll('.col.over').forEach(c=>c!==col&&c.classList.remove('over'));col.classList.add('over')});
document.addEventListener('drop',async ev=>{const col=ev.target.closest?.('.col');if(!col)return;ev.preventDefault();col.classList.remove('over');
  const id=ev.dataTransfer.getData('text/plain');const d=byId('deals',id);if(d&&d.stage!==col.dataset.stage){await patch('deals',id,{stage:col.dataset.stage});
    if(col.dataset.stage==='won'&&!d.eventId)toast('Сделка выиграна. Создайте по ней мероприятие.')}});

/* ---------- auth & boot ---------- */
const CFG=window.AWARENESS||{};
let channel=null;
function authScreen(mode,msg=''){const a=$('#auth');a.hidden=false;
  const brand='<div class="brand"><img class="logo" src="icon.svg" alt=""><div>AWARENESS<small>CRM ивент-агентства</small></div></div>';
  if(mode==='config'){a.innerHTML=`<div class="auth-card">${brand}<p>Приложение ещё не подключено к базе. Впишите адрес проекта Supabase и публичный ключ в файл <b>config.js</b> и загрузите сайт заново.</p></div>`;return}
  if(mode==='lib'){a.innerHTML=`<div class="auth-card">${brand}<p>Не удалось загрузить модуль связи с базой. Проверьте интернет и обновите страницу.</p></div>`;return}
  if(mode==='login')a.innerHTML=`<form class="auth-card" data-auth="login">${brand}<p>Вход для сотрудников</p>
    <label class="fld"><span>Email</span><input id="au-email" name="email" type="email" autocomplete="username" required></label>
    <label class="fld"><span>Пароль</span><input id="au-pass" name="password" type="password" autocomplete="current-password" required></label>
    ${msg?`<div class="err">${esc(msg)}</div>`:''}<button class="btn pri">Войти</button><button type="button" class="link" data-auth-act="forgot">Забыли пароль?</button></form>`;
  if(mode==='forgot')a.innerHTML=`<form class="auth-card" data-auth="forgot">${brand}<p>Пришлём ссылку для смены пароля на вашу почту.</p>
    <label class="fld"><span>Email</span><input id="au-email2" name="email" type="email" required></label>${msg?`<div class="err">${esc(msg)}</div>`:''}
    <button class="btn pri">Отправить ссылку</button><button type="button" class="link" data-auth-act="login">← Ко входу</button></form>`;
  if(mode==='sent')a.innerHTML=`<div class="auth-card">${brand}<p>Письмо отправлено. Откройте ссылку из письма на этом устройстве.</p><button type="button" class="link" data-auth-act="login">← Ко входу</button></div>`;
  if(mode==='newpass')a.innerHTML=`<form class="auth-card" data-auth="newpass">${brand}<p>Придумайте новый пароль (не короче 8 символов).</p>
    <label class="fld"><span>Новый пароль</span><input id="au-new" name="password" type="password" minlength="8" autocomplete="new-password" required></label>${msg?`<div class="err">${esc(msg)}</div>`:''}
    <button class="btn pri">Сохранить пароль</button></form>`;
  setTimeout(()=>a.querySelector('input')?.focus(),30)}
document.addEventListener('submit',async ev=>{const f=ev.target;const m=f.dataset?.auth;if(!m)return;ev.preventDefault();ev.stopImmediatePropagation();
  const btn=f.querySelector('.btn.pri');btn.disabled=true;
  if(m==='login'){const {error}=await S.db.auth.signInWithPassword({email:f.email.value.trim(),password:f.password.value});
    if(error){btn.disabled=false;authScreen('login',/Invalid login/i.test(error.message)?'Неверный email или пароль.':error.message)}}
  if(m==='forgot'){const {error}=await S.db.auth.resetPasswordForEmail(f.email.value.trim(),{redirectTo:location.origin+location.pathname});
    if(error){btn.disabled=false;authScreen('forgot',error.message)}else authScreen('sent')}
  if(m==='newpass'){const {error}=await S.db.auth.updateUser({password:f.password.value});
    if(error){btn.disabled=false;authScreen('newpass',error.message)}else{toast('Пароль изменён');$('#auth').hidden=true;start()}}
},true);
document.addEventListener('click',ev=>{const b=ev.target.closest?.('[data-auth-act]');if(b)authScreen(b.dataset.authAct)});
async function signOut(){try{await S.db.auth.signOut()}catch(e){}location.hash='';location.reload()}
async function fetchAll(t){let all=[],from=0;for(;;){const {data,error}=await S.db.from(t).select('id,data,created_at').order('created_at').range(from,from+999);
  if(error)throw error;all=all.concat(data);if(data.length<1000)break;from+=1000}return all}
let started=false;
async function start(){if(started)return;started=true;$('#auth').hidden=true;render();
  try{const {data:{user}}=await S.db.auth.getUser();
    const {data:profs,error:pe}=await S.db.from('profiles').select('*');if(pe)throw pe;
    S.profiles=profs||[];S.me=S.profiles.find(p=>p.id===user.id)||{id:user.id,email:user.email,name:user.email,role:'manager'};S.isAdmin=S.me.role==='admin';
    const {data:st}=await S.db.from('settings').select('id,data');S.extraTeam=(st||[]).find(r=>r.id==='team')?.data?.members||[];recomputeTeam();
    await Promise.all(COLS.map(async c=>{if(c==='finance'&&!S.isAdmin){S.finance=[];S.loaded.add(c);return}S[c]=(await fetchAll(c)).map(rowToDoc);S.loaded.add(c)}));
  }catch(e){console.error(e);S.nodb=true;render();return}
  render();
  channel=S.db.channel('crm-live').on('postgres_changes',{event:'*',schema:'public'},p=>{const t=p.table;
    if(t==='profiles'){if(p.eventType==='DELETE')S.profiles=S.profiles.filter(x=>x.id!==p.old.id);else{const i=S.profiles.findIndex(x=>x.id===p.new.id);if(i>=0)S.profiles[i]=p.new;else S.profiles.push(p.new);
      if(p.new.id===S.me?.id&&p.new.role!==S.me.role){location.reload();return}}recomputeTeam();schedule();return}
    if(t==='settings'){if(p.new?.id==='team'){S.extraTeam=p.new.data?.members||[];recomputeTeam();schedule()}return}
    if(!COLS.includes(t))return;
    if(p.eventType==='DELETE'){S[t]=S[t].filter(x=>x.id!==p.old.id);schedule()}else upsertLocal(t,rowToDoc(p.new))}).subscribe();
  let syncing=false;
  const syncAll=async()=>{if(syncing||S.nodb||document.visibilityState!=='visible')return;syncing=true;
    try{await Promise.all(COLS.map(async c=>{if(c==='finance'&&!S.isAdmin)return;S[c]=(await fetchAll(c)).map(rowToDoc)}));
      const {data:profs}=await S.db.from('profiles').select('*');if(profs){S.profiles=profs;const m=profs.find(p=>p.id===S.me?.id);if(m&&m.role!==S.me.role){location.reload();return}}
      const {data:st}=await S.db.from('settings').select('id,data');if(st)S.extraTeam=st.find(r=>r.id==='team')?.data?.members||[];
      recomputeTeam();schedule()}catch(e){}finally{syncing=false}};
  document.addEventListener('visibilitychange',syncAll);
  setInterval(syncAll,15000);
}
(function(){const h=(location.hash||'').slice(1);if(NAV.some(n=>n[0]===h))S.view=h})();
(async()=>{
  if(!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY||/ВСТАВЬТЕ/.test(CFG.SUPABASE_URL))return authScreen('config');
  if(!window.supabase)return authScreen('lib');
  let recovering=/type=recovery/.test(location.hash);
  S.db=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  S.db.auth.onAuthStateChange((event,session)=>{
    if(event==='PASSWORD_RECOVERY'){recovering=true;authScreen('newpass');return}
    if(event==='SIGNED_IN'&&!recovering)start();
    if(event==='SIGNED_OUT'&&started)location.reload()});
  const {data:{session}}=await S.db.auth.getSession();
  if(recovering)return;
  if(session)start();else authScreen('login');
})();
</script>
